math:`<svg ${c}><path d="M5 19 19 5"/><path d="M7 7h.01M17 17h.01"/><path d="M3 3h18v18H3z"/></svg>`,language:`<svg ${c}><path d="M4 5h8M8 5c0 5-2 8-5 10M5 10c2 2 4 3 7 4"/><path d="M14 14h6M17 11l-3 8m2-3h4"/></svg>`,science:`<svg ${c}><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M8 16h8"/></svg>`,english:`<svg ${c}><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 0-3-3z"/><path d="M5 4v13M9 8h6M9 12h5"/></svg>`,sst:`<svg ${c}><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.2 2.4 3.3 5.2 3.3 8.5S14.2 18.1 12 20.5C9.8 18.1 8.7 15.3 8.7 12S9.8 5.9 12 3.5z"/></svg>`,calendar:`<svg ${c}><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>`,check:`<svg ${c}><path d="m5 12 4 4L19 6"/></svg>`,back:`<svg ${c}><path d="m15 18-6-6 6-6"/></svg>`,settings:`<svg ${c}><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.6a6 6 0 0 0-.7-1.7l.9-1.8-2.1-2.1-1.8.9a6 6 0 0 0-1.7-.7L11 2.5H8l-.6 2a6 6 0 0 0-1.7.7l-1.8-.9-2.1 2.1.9 1.8a6 6 0 0 0-.7 1.7l-2 .6v3l2 .6c.2.6.4 1.2.7 1.7l-.9 1.8 2.1 2.1 1.8-.9c.5.3 1.1.5 1.7.7l.6 2h3l.6-2c.6-.2 1.2-.4 1.7-.7l1.8.9 2.1-2.1-.9-1.8c.3-.5.5-1.1.7-1.7z"/></svg>`,close:`<svg ${c}><path d="m6 6 12 12M18 6 6 18"/></svg>`,play:`<svg ${c}><path d="m9 6 9 6-9 6z"/></svg>`};return p[type]||""}
function subjectGroups(name){return name==="Urdu/Hindi"?SUBJECTS[name].languages[language]:SUBJECTS[name].groups}
function slotKey(name,topic){return name+"::"+topic}
function allTopics(name){const out=[];subjectGroups(name).forEach(([g,topics])=>topics.forEach(t=>out.push({g,t})));return out}
function countedTopics(name){return allTopics(name).filter(x=>!(name==="Social Science"&&PERIODIC.has(x.t)))}
function progress(name){const a=countedTopics(name);if(name==="Social Science"){const normal=a.filter(x=>x.t!=="The Making of a Global World"&&x.t!=="The Age of Industrialization");const choiceDone=done[slotKey(name,"The Making of a Global World")]||done[slotKey(name,"The Age of Industrialization")];const total=normal.length+1,complete=normal.filter(x=>done[slotKey(name,x.t)]).length+(choiceDone?1:0);return{complete,total,pct:Math.round(complete/total*100)}}const complete=a.filter(x=>done[slotKey(name,x.t)]).length;return{complete,total:a.length,pct:a.length?Math.round(complete/a.length*100):0}}
function overall(){let c=0,t=0;subjects().forEach(s=>{const p=progress(s);c+=p.complete;t+=p.total});return{c,t,p:t?Math.round(c/t*100):0}}
function subjects(){return Object.keys(SUBJECTS)}
function nextExam(){const now=new Date();return subjects().map(s=>({s,d:new Date(EXAMS[s])})).filter(x=>x.d>now).sort((a,b)=>a.d-b.d)[0]||null}
function upcoming(){const now=new Date();return subjects().map(s=>({s,d:new Date(EXAMS[s])})).filter(x=>x.d>now).sort((a,b)=>a.d-b.d).slice(0,3)}
function daysUntil(d){return Math.max(0,Math.ceil((d-new Date())/86400000))}
function dateText(s){return new Date(EXAMS[s]).toLocaleDateString(undefined,{day:"numeric",month:"short"})}
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()}
function todayCount(){const k=dayKey(Date.now());return Object.entries(lastRevised).filter(([key,ts])=>done[key]&&dayKey(ts)===k).length}
function streak(){const keys=new Set(Object.values(lastRevised).map(dayKey));let d=new Date();let count=0;while(keys.has(dayKey(d.getTime()))){count++;d.setDate(d.getDate()-1)}return count}
function revisedLabel(ts){if(!ts)return"Tap to mark revised";if(dayKey(ts)===dayKey(Date.now()))return"Revised today";return"Last revised · "+new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short"})}
function firstIncomplete(){for(const s of subjects()){const x=countedTopics(s).find(x=>!done[slotKey(s,x.t)]);if(x)return{s,t:x.t}}return null}
function renderHome(){const o=overall(),nx=nextExam(),tc=todayCount(),st=streak(),ring=`style="--p:${o.p*3.6}deg"`;document.getElementById("home").innerHTML=`
<div class="top"><div class="brand"><div class="brand-mark">${icon("check")}</div><div><h1>SMT</h1><div class="sub">Class 10 · Smart Revision Tracker</div></div></div><button class="icon-btn" id="infoBtn" aria-label="Settings">${icon("settings")}</button></div>
<section class="hero"><div class="hero-row"><div><div class="eyebrow">OVERALL PROGRESS</div><h2>${o.p}%</h2><p>${o.c} of ${o.t} tracked slots completed</p></div><div class="ring" ${ring}><span>${o.p}%</span></div></div>${nx?`<div class="next"><div class="next-left">${icon("calendar")}<div><div class="next-title">Next exam · ${nx.s}</div><div class="next-meta">${dateText(nx.s)} · 11:00 AM</div></div></div><div class="next-days">${daysUntil(nx.d)}<div class="next-meta">days</div></div></div>`:""}</section>
<div class="section-title"><h3>Today</h3></div><div class="today"><div class="today-head"><div><div class="today-title">Daily revision goal</div><div class="today-sub">${tc} of ${dailyGoal} topics revised today · ${st} day streak</div></div><div class="goal">${Math.min(tc,dailyGoal)}/${dailyGoal}</div></div><div class="goalbar"><i style="width:${Math.min(100,Math.round(tc/dailyGoal*100))}%"></i></div><div class="today-actions"><button class="mini-action primary" id="continueBtn">${icon("play")} Continue revision</button><button class="mini-action" id="subjectsBtn">Browse subjects</button></div></div>
<div class="section-title"><h3>Board weightage</h3></div><div class="marks-summary"><div class="marks-chip"><strong>80M</strong><span>Theory paper</span></div><div class="marks-chip"><strong>20M</strong><span>Internal assessment</span></div></div><div class="section-title"><h3>Subjects</h3><button id="openSubjects">View all</button></div><div class="subjects">${subjects().map(s=>{const p=progress(s);return `<div class="card" data-s="${s}"><div class="card-head"><div class="subject-icon">${icon(SUBJECTS[s].icon)}</div><div class="pct">${p.pct}%</div></div><h4>${s}</h4><div class="date">${dateText(s)} · 11:00 AM</div><div class="bar"><i style="width:${p.pct}%"></i></div><div class="progress-label"><span>${p.complete}/${p.total}</span><span>${SUBJECTS[s].marks}</span></div></div>`}).join("")}</div>
<div class="section-title"><h3>Upcoming exams</h3></div><div class="exam-list">${upcoming().map(x=>`<div class="exam"><div class="exam-date">${new Date(x.d).toLocaleDateString(undefined,{day:"2-digit",month:"short"})}</div><div class="exam-info"><div class="exam-name">${x.s}</div><div class="exam-meta">11:00 AM · ${progress(x.s).pct}% ready</div></div><div class="exam-count">${daysUntil(x.d)}d</div></div>`).join("")||`<div class="empty">All listed exams have passed.</div>`}</div>
<div class="section-title"><h3>At a glance</h3></div><div class="stats"><div class="stat accent"><strong>${o.c}</strong><span>Completed</span></div><div class="stat"><strong>${o.t-o.c}</strong><span>Remaining</span></div><div class="stat"><strong>${st}</strong><span>Day streak</span></div></div>`;
 document.querySelectorAll(".card").forEach(c=>c.onclick=()=>openSubject(c.dataset.s));document.getElementById("openSubjects").onclick=()=>openSubject(subjects()[0]);document.getElementById("subjectsBtn").onclick=()=>openSubject(subjects()[0]);document.getElementById("continueBtn").onclick=()=>{const x=firstIncomplete();x?openSubject(x.s):openSubject(subjects()[0])};document.getElementById("infoBtn").onclick=openSettings}
function renderSubject(){const name=current,p=progress(name),groups=subjectGroups(name);document.getElementById("subject").innerHTML=`<button class="back" id="back">${icon("back")} All subjects</button><div class="subject-banner"><div class="subject-banner-top"><div><h2>${name}</h2><p>${dateText(name)} · 11:00 AM · ${SUBJECTS[name].marks}</p></div><div class="big-pct">${p.pct}%</div></div><div class="detail-bar"><i style="width:${p.pct}%"></i></div><div class="progress-label"><span>${p.complete} completed</span><span>${p.total-p.complete} remaining</span></div></div><div class="weightage-note"><span class="weightage-dot"></span>Board weightage shown where the JKBOSE syllabus specifies it.</div>${name==="Urdu/Hindi"?`<div class="lang-switch"><button class="${language==="Urdu"?"active":""}" data-lang="Urdu">Urdu</button><button class="${language==="Hindi"?"active":""}" data-lang="Hindi">Hindi</button></div>`:""}<div class="detail-tools"><input class="search" id="topicSearch" placeholder="Search topics..."/><select class="filter" id="topicFilter"><option value="all">All</option><option value="remaining">Remaining</option><option value="done">Completed</option></select></div><div id="groups"></div><div class="action-row"><button class="action primary" id="checkAll">Mark all complete</button><button class="action" id="clearSubject">Clear subject</button></div>`;document.getElementById("back").onclick=showHome;document.querySelectorAll(".lang-switch button").forEach(b=>b.onclick=()=>{language=b.dataset.lang;save();renderSubject()});document.getElementById("topicSearch").oninput=renderGroups;document.getElementById("topicFilter").onchange=renderGroups;renderGroups();document.getElementById("checkAll").onclick=()=>{countedTopics(name).forEach(x=>{done[slotKey(name,x.t)]=true;lastRevised[slotKey(name,x.t)]=Date.now()});if(name==="Social Science"){delete done[slotKey(name,"The Age of Industrialization")];done[slotKey(name,"The Making of a Global World")]=true}save();renderSubject()};document.getElementById("clearSubject").onclick=()=>{allTopics(name).forEach(x=>delete done[slotKey(name,x.t)]);save();renderSubject()}}
function renderGroups(){const name=current,search=(document.getElementById("topicSearch")?.value||"").toLowerCase().trim(),filter=document.getElementById("topicFilter")?.value||"all",groups=subjectGroups(name);let html="";groups.forEach(([g,topics])=>{const rows=topics.filter(t=>{const periodic=name==="Social Science"&&PERIODIC.has(t),is=!!done[slotKey(name,t)];if(periodic)return filter==="all"&&(!search||t.toLowerCase().includes(search));if(filter==="done"&&!is)return false;if(filter==="remaining"&&is)return false;return !search||t.toLowerCase().includes(search)});if(!rows.length)return;html+=`<div class="group"><div class="group-title"><strong>${g}</strong><span class="unit-mark">${groupMarks(name,g)?groupMarks(name,g)+" marks":"Board breakup not specified"}</span></div>${rows.map(t=>{const periodic=name==="Social Science"&&PERIODIC.has(t);let is=!!done[slotKey(name,t)],choice=name==="Social Science"&&(t==="The Making of a Global World"||t==="The Age of Industrialization");if(choice&&(done[slotKey(name,"The Making of a Global World")]||done[slotKey(name,"The Age of Industrialization")]))is=true;const cm=chapterMarks(name,t);return `<div class="topic ${is?"done":""} ${periodic?"periodic":""}" data-topic="${encodeURIComponent(t)}"><button class="check" ${periodic?"disabled":""}>${icon("check")}</button><div><div class="topic-name">${t}</div><div class="topic-meta">${periodic?"Periodic test only":choice?"Choice topic — one of two":revisedLabel(lastRevised[slotKey(name,t)])}</div></div>${cm?`<span class="mark-badge">${cm} marks</span>`:""}${choice?`<span class="choice-badge">CHOICE</span>`:""}</div>`}).join("")}</div>`});document.getElementById("groups").innerHTML=html||`<div class="empty">No topics match your search or filter.</div>`;document.querySelectorAll(".topic").forEach(row=>row.onclick=()=>toggleTopic(decodeURIComponent(row.dataset.topic)))}
function toggleTopic(t){const name=current;if(name==="Social Science"&&PERIODIC.has(t))return;if(name==="Social Science"&&(t==="The Making of a Global World"||t==="The Age of Industrialization")){const other=t==="The Making of a Global World"?"The Age of Industrialization":"The Making of a Global World";if(done[slotKey(name,t)])delete done[slotKey(name,t)];else{delete done[slotKey(name,other)];done[slotKey(name,t)]=true;lastRevised[slotKey(name,t)]=Date.now()}}else{const k=slotKey(name,t);if(done[k])delete done[k];else{done[k]=true;lastRevised[k]=Date.now()}}save();renderSubject()}
function openSubject(name){current=name;document.getElementById("home").classList.remove("active");document.getElementById("subject").classList.add("active");document.getElementById("navHome").classList.remove("active");document.getElementById("navSubjects").classList.add("active");renderSubject();window.scrollTo({top:0,behavior:"smooth"})}
function showHome(){document.getElementById("home").classList.add("active");document.getElementById("subject").classList.remove("active");document.getElementById("navHome").classList.add("active");document.getElementById("navSubjects").classList.remove("active");renderHome();window.scrollTo({top:0,behavior:"smooth"})}
function openSettings(){document.getElementById("modal").innerHTML=`<div class="modal-head"><h3>SMT settings</h3><button class="close" id="closeModal">${icon("close")}</button></div><p>Your progress stays on this phone. No account or internet connection is required.</p><div class="setting"><div class="setting-row"><div><div class="setting-title">Daily topic goal</div><div class="setting-desc">Used for the Today progress bar.</div></div><input class="goal-input" id="goalInput" type="number" min="1" max="20" value="${dailyGoal}"/></div></div><div class="setting"><div class="setting-row"><div><div class="setting-title">Language preference</div><div class="setting-desc">Used inside Urdu/Hindi subject.</div></div><strong>${language}</strong></div></div><div class="setting"><div class="setting-title">About</div><div class="setting-desc">SMT · Class 10 offline revision companion · v1.2</div></div>`;document.getElementById("modalWrap").classList.add("show");document.getElementById("closeModal").onclick=closeSettings;document.getElementById("goalInput").onchange=e=>{dailyGoal=Math.min(20,Math.max(1,parseInt(e.target.value||3,10)));save();renderHome();openSettings()};document.getElementById("modalWrap").onclick=e=>{if(e.target.id==="modalWrap")closeSettings()}}
function closeSettings(){document.getElementById("modalWrap").classList.remove("show")}
document.getElementById("navHome").onclick=showHome;document.getElementById("navSubjects").onclick=()=>openSubject(subjects()[0]);document.getElementById("navReset").onclick=()=>{if(confirm("Reset every subject's progress?")){done={};lastRevised={};save();showHome()}};renderHome();
</script></body></html>
